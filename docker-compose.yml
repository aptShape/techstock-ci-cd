name: techstock

services:
  mongo:
    image: mongo:latest
    container_name: techstock-mongo
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Set MONGO_INITDB_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_INITDB_ROOT_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: techstock-backend
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Set MONGO_INITDB_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_INITDB_ROOT_PASSWORD in .env}
      MONGO_HOST: mongo
      MONGO_DB: ${MONGO_DB:-techstock_db}

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: techstock-frontend
    environment:
      BACKEND_HOST: backend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data:
