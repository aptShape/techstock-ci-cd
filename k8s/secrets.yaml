# Example only. Create mongo-secret with your own credentials as described in README.md.
# Do not apply these placeholders or commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: mongo-secret
  namespace: techstock-ns
type: Opaque
stringData:
  mongo-root-username: "<MONGO_USERNAME>"
  mongo-root-password: "<MONGO_PASSWORD>"
